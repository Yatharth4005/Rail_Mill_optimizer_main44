{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAP ERP System — Campaign Plan Portal Login</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'casting_plan/css/app.css' %}?v=5.0">
    <style>
        body.sap-login-body {
            background: linear-gradient(135deg, #0b192c 0%, #1e3a8a 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .sap-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 440px;
            padding: 40px 36px;
            box-sizing: border-box;
        }
        .sap-logo-badge {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            padding: 8px 18px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
        }
    </style>
</head>
<body class="sap-login-body">
    <div class="sap-card">
        <div style="text-align: center;">
            <div class="sap-logo-badge">SAP ERP</div>
            <h1 style="font-size: 22px; font-weight: 800; color: #ffffff; margin: 0 0 6px 0;">SAP Campaign Portal</h1>
            <p style="font-size: 13px; color: #94a3b8; margin: 0 0 28px 0;">Jindal Steel &amp; Power — Central ERP Integration</p>
        </div>

        {% if error %}
        <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 12px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
            <span>⚠️ {{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="{% url 'sap_login' %}">
            {% csrf_token %}
            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 12px; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">SAP Username</label>
                <input type="text" name="username" value="sap" style="width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px 14px; color: #ffffff; font-size: 14px; box-sizing: border-box; font-family: inherit;" required>
            </div>

            <div style="margin-bottom: 24px;">
                <label style="display: block; font-size: 12px; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">SAP Password</label>
                <input type="password" name="password" value="sap123" style="width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px 14px; color: #ffffff; font-size: 14px; box-sizing: border-box; font-family: inherit;" required>
            </div>

            <button type="submit" style="width: 100%; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); border: none; border-radius: 8px; padding: 14px; color: #ffffff; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);">
                Sign In to SAP ERP Portal →
            </button>
        </form>

        <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); text-align: center;">
            <p style="font-size: 12px; color: #64748b; margin-bottom: 10px;">SAP Default Credentials: <strong>sap</strong> / <strong>sap123</strong></p>
            <a href="{% url 'dashboard' %}" style="color: #38bdf8; text-decoration: none; font-size: 13px; font-weight: 600;">← Return to Rail Mill Optimizer</a>
        </div>
    </div>
</body>
</html>
